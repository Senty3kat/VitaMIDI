name: Build PS Vita USB MIDI modules

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Fetch upstream source
        run: |
          git clone --depth 1 \
            https://github.com/intermynd-instruments/psvita-usb-audio-midi.git \
            upstream

      - name: Patch MIDI Note On and Note Off
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/common/midi_core.c")
          s = p.read_text()

          old = """int psvita_usb_midi_event_supported(const PsvitaUsbMidiEvent *event)
          {
          \tif (!event || event->cable != 0 || event->size != 1) return 0;
          \treturn realtime_status_supported(event->data[0]);
          }"""
          new = """int psvita_usb_midi_event_supported(const PsvitaUsbMidiEvent *event)
          {
          \tuint8_t status;
          \tif (!event || event->cable != 0) return 0;
          \tif (event->size == 1)
          \t\treturn realtime_status_supported(event->data[0]);
          \tif (event->size != 3) return 0;
          \tstatus = event->data[0];
          \tif ((status & 0xf0u) != 0x80u && (status & 0xf0u) != 0x90u)
          \t\treturn 0;
          \treturn event->data[1] < 128u && event->data[2] < 128u;
          }"""
          if old not in s:
              raise SystemExit("Patch failed: event_supported function differs from expected upstream version.")
          s = s.replace(old, new, 1)

          old = """\t\t/*
          \t\t * System real-time messages are global, not channel/cable scoped. Some
          \t\t * embedded USB hosts have been observed to preserve a non-zero virtual
          \t\t * cable nibble or stale CIN/padding bytes even though byte 1 contains a
          \t\t * valid one-byte real-time message. Accept that harmless framing variance
          \t\t * and normalize it to DS-8's single cable.
          \t\t */
          \t\tevent.cable = 0;
          \t\tevent.size = 1;
          \t\tevent.data[0] = bytes[offset + 1u];
          \t\tif (!realtime_status_supported(event.data[0])) {
          \t\t\tresult.filtered++;
          \t\t\tcontinue;
          \t\t}
          \t\t(void)cable;
          \t\t(void)cin;"""
          new = """\t\tevent.cable = 0;
          \t\tif (cable == 0u && (cin == 0x8u || cin == 0x9u) &&
          \t\t    (bytes[offset + 1u] & 0xf0u) == (cin << 4) &&
          \t\t    bytes[offset + 2u] < 128u && bytes[offset + 3u] < 128u) {
          \t\t\tevent.size = 3;
          \t\t\tevent.data[0] = bytes[offset + 1u];
          \t\t\tevent.data[1] = bytes[offset + 2u];
          \t\t\tevent.data[2] = bytes[offset + 3u];
          \t\t} else {
          \t\t\tevent.size = 1;
          \t\t\tevent.data[0] = bytes[offset + 1u];
          \t\t\tif (!realtime_status_supported(event.data[0])) {
          \t\t\t\tresult.filtered++;
          \t\t\t\tcontinue;
          \t\t\t}
          \t\t}"""
          if old not in s:
              raise SystemExit("Patch failed: MIDI packet parser differs from expected upstream version.")
          s = s.replace(old, new, 1)

          old = """int psvita_usb_midi_encode_event(const PsvitaUsbMidiEvent *event,
          \tuint8_t packet[4])
          {
          \tif (!packet || !psvita_usb_midi_event_supported(event)) return 0;
          \tpacket[0] = 0x0fu;
          \tpacket[1] = event->data[0];
          \tpacket[2] = 0;
          \tpacket[3] = 0;
          \treturn 1;
          }"""
          new = """int psvita_usb_midi_encode_event(const PsvitaUsbMidiEvent *event,
          \tuint8_t packet[4])
          {
          \tif (!packet || !psvita_usb_midi_event_supported(event)) return 0;
          \tif (event->size == 3u) {
          \t\tpacket[0] = (uint8_t)((event->cable << 4) |
          \t\t\t((event->data[0] >> 4) & 0x0fu));
          \t\tpacket[1] = event->data[0];
          \t\tpacket[2] = event->data[1];
          \t\tpacket[3] = event->data[2];
          \t} else {
          \t\tpacket[0] = 0x0fu;
          \t\tpacket[1] = event->data[0];
          \t\tpacket[2] = 0;
          \t\tpacket[3] = 0;
          \t}
          \treturn 1;
          }"""
          if old not in s:
              raise SystemExit("Patch failed: MIDI encoder differs from expected upstream version.")
          s = s.replace(old, new, 1)

          p.write_text(s)
          print("MIDI Note On/Off patch applied.")
          PY

      - name: Configure Vita build
        working-directory: upstream
        shell: bash
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$VITASDK/arm-vita-eabi/bin:$PATH"
          cmake -S . -B build/vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DPSVITA_USB_AUDIO_MIDI_VITA=ON

      - name: Show available CMake targets
        working-directory: upstream
        shell: bash
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$VITASDK/arm-vita-eabi/bin:$PATH"
          cmake --build build/vita --target help

      - name: Build kernel, client, and stubs
        working-directory: upstream
        shell: bash
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$VITASDK/arm-vita-eabi/bin:$PATH"
          cmake --build build/vita \
            --target \
              psvita_usb_audio_midi_kernel \
              psvita_usb_audio_midi_client \
              public_stub_aliases \
            --parallel 2

      - name: Try packaging Vita SELF modules
        working-directory: upstream
        shell: bash
        continue-on-error: true
        run: |
          export VITASDK="${VITASDK:-/usr/local/vitasdk}"
          export PATH="$VITASDK/bin:$VITASDK/arm-vita-eabi/bin:$PATH"
          cmake --build build/vita \
            --target \
              psvita_usb_audio_midi.skprx-self \
              psvita_usb_audio_midi_client.suprx-self \
            --parallel 2

      - name: List generated files
        if: always()
        shell: bash
        run: |
          echo "=== SELF modules ==="
          find upstream/build/vita -type f \
            \\( -name '*.skprx' -o -name '*.suprx' \\) \
            -print || true
          echo "=== ELF and archives ==="
          find upstream/build/vita -type f \
            \\( -name '*.elf' -o -name '*.a' \\) \
            -print || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-usb-midi-build
          path: |
            upstream/build/vita/**/*.skprx
            upstream/build/vita/**/*.suprx
            upstream/build/vita/**/*.elf
            upstream/build/vita/**/*.a
          if-no-files-found: warn
